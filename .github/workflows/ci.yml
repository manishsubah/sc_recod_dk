name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Pigeon output is up to date
        working-directory: packages/reclite_engine
        run: |
          flutter pub get
          dart run pigeon --input pigeons/engine_api.dart
          git diff --exit-code -- lib/src macos windows
      # Generated files (*.g.dart) are committed exactly as Pigeon writes them.
      - name: Formatting
        run: |
          find lib test integration_test packages/reclite_engine/lib -name '*.dart' ! -name '*.g.dart' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze
      - run: flutter test
      # The Windows engine's mixer, timeline and session.json code is portable C++.
      - name: Windows engine unit tests (portable C++)
        working-directory: packages/reclite_engine/windows
        run: |
          g++ -std=c++17 -fno-exceptions -Wall -I. test/audio_mixer_test.cpp audio/audio_mixer.cpp audio/audio_pipeline.cpp -o /tmp/audio_test
          /tmp/audio_test
          g++ -std=c++17 -fno-exceptions -Wall test/storage_test.cpp storage/session_manifest.cpp storage/disk_guard.cpp -o /tmp/storage_test
          /tmp/storage_test

  build-macos:
    name: Build macOS
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --debug

  build-windows:
    name: Build Windows
    needs: analyze-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      # Download from the run's "Artifacts" section, unzip, run RecLite.exe.
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: RecLite-windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14
