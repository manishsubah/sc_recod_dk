name: reclite
description: "RecLite — lightweight desktop screen recorder."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  reclite_engine:
    path: packages/reclite_engine
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/reelyte_icon.jpg
    - assets/reelyte_icon.svg
